<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Webpage</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Container Card */
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      text-align: center;
    }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    /* Typography */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      margin-bottom: 1.75rem;
    }

    /* Interactive Box */
    .interactive-box {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
    }

    .counter {
      font-size: 2.5rem;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 0.5rem;
    }

    /* Button */
    .btn {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #4338ca;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Links / Footer info */
    .footer-links {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .footer-links a {
      color: #4f46e5;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">🚀 Webpage Ready</span>
    <h1>Hello, World!</h1>
    <p>This is your clean, self-contained single-file webpage. You can easily edit any text, styling, or scripts right here in this file.</p>

    <!-- Interactive Section -->
    <div class="interactive-box">
      <div id="counter" class="counter">0</div>
      <button id="click-btn" class="btn">Click Me!</button>
    </div>

    <!-- Quick Footer -->
    <div class="footer-links">
      <span>Connected to </span>
      <a href="https://github.com/teses2/hello-github" target="_blank" rel="noopener">teses2/hello-github</a>
    </div>
  </div>

  <script>
    // Simple Interactive Logic
    let count = 0;
    const counterElement = document.getElementById('counter');
    const buttonElement = document.getElementById('click-btn');

    buttonElement.addEventListener('click', () => {
      count++;
      counterElement.textContent = count;
    });
  </script>
</body>
</html>
